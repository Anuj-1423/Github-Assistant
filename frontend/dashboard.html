<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Codebase Knowledge AI</title>
    <link rel="stylesheet" href="style.css?v=professional-v2">
    <meta http-equiv="refresh" content="0; url=user-dashboard.html">
    <script>window.location.href = 'user-dashboard.html';</script>
<script>
    const __originalFetch = window.fetch;
    window.fetch = async function(...args) {
        const url = args[0];
        const options = args[1] || {};
        const method = options.method || 'GET';
        if (method !== 'GET' || typeof url !== 'string' || !url.startsWith('/api/')) { return __originalFetch.apply(this, args); }
        const cacheKey = 'api_cache_' + url;
        const cachedData = sessionStorage.getItem(cacheKey);
        if (cachedData) {
            __originalFetch.apply(this, args).then(async res => {
                if (res.ok) {
                    const text = await res.clone().text();
                    sessionStorage.setItem(cacheKey, text);
                }
            }).catch(e => {});
            return new Response(cachedData, { status: 200, headers: new Headers({ 'Content-Type': 'application/json' }) });
        }
        const response = await __originalFetch.apply(this, args);
        if (response.ok) {
            const text = await response.clone().text();
            sessionStorage.setItem(cacheKey, text);
        }
        return response;
    };
</script>
</head>
<body>
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0c; color: #0f172a; font-family: 'Plus Jakarta Sans', sans-serif;">
        <div style="text-align: center;">
            <div class="logo-box" style="margin: 0 auto 24px;">CK</div>
            <p style="font-size: 14px; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800;">Redirecting to Neural Dashboard</p>
        </div>
    </div>
</body>
</html>
