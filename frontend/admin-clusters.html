<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Clusters | Codebase Knowledge AI</title>
    <link rel="stylesheet" href="style.css?v=professional-v2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 40px; }
        .admin-card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 32px; transition: var(--transition-smooth); }
        .admin-card:hover { border-color: var(--primary-brand); transform: translateY(-4px); box-shadow: var(--shadow-glow); }
        .badge-admin { background: #ef4444; color: #0f172a; padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; }
        .cluster-node-full { background: #ffffff; border: 1px solid var(--border-subtle); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 16px; }
        .node-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .stat-bar-bg { width: 100%; height: 6px; background: rgba(0,0,0,0.05); border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .stat-bar-fill { height: 100%; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="nav-rail">
            <div class="rail-item active" style="margin-bottom: 24px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
            <div class="rail-item" onclick="window.location.href='user-dashboard.html'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
            <div id="user-avatar" class="rail-item" style="margin-top: auto; background: var(--surface-card); border: 1px solid var(--border-subtle); font-weight: 800;">A</div>
        </aside>

        <aside class="sidebar">
            <div style="margin-bottom: 40px; display: flex; align-items: center; gap: 16px;">
                <div class="logo-box" style="width: 36px; height: 36px; background: #ef4444;">
                    <i class="fas fa-shield-alt" style="font-size: 16px; color: #0f172a;"></i>
                </div>
                <div>
                    <h1 style="font-size: 15px; font-weight: 800; letter-spacing: 0.05em; line-height: 1;">CORE CONTROL</h1>
                    <span style="font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em;">ADMINISTRATIVE INTERFACE</span>
                </div>
            </div>

            <nav style="display: flex; flex-direction: column; gap: 10px; margin-top: 56px;">
                <button class="sidebar-nav-btn" onclick="window.location.href='admin-dashboard.html'"><i class="fas fa-server"></i> System Overview</button>
                <button class="sidebar-nav-btn" onclick="window.location.href='admin-users.html'"><i class="fas fa-users-cog"></i> User Management</button>
                <button class="sidebar-nav-btn" onclick="window.location.href='admin-analytics.html'"><i class="fas fa-database"></i> Database Health</button>
                <button class="sidebar-nav-btn active"><i class="fas fa-microchip"></i> Node Clusters</button>
                <button class="sidebar-nav-btn" onclick="window.location.href='admin-settings.html'"><i class="fas fa-cog"></i> Global Settings</button>
                <button class="sidebar-nav-btn" style="margin-top: 32px; color: var(--text-secondary); transition: all 0.2s;" onmouseover="this.style.color='#ef4444'; this.style.background='rgba(239, 68, 68, 0.05)'" onmouseout="this.style.color='var(--text-secondary)'; this.style.background='transparent'" onclick="window.location.href='login.html'"><i class="fas fa-power-off"></i> Terminate Admin Session</button>
            </nav>
        </aside>

        <main class="main-content" style="padding: 60px; overflow-y: auto; flex: 1;">
            <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 64px;">
                <div>
                    <h2 style="font-size: 40px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.02em;">Node Clusters</h2>
                    <p style="color: var(--text-secondary); font-size: 16px;">Manage distributed inference and indexing nodes across all regions.</p>
                </div>
                <div style="display: flex; gap: 16px;">
                    <button class="btn btn-secondary" style="border-color: var(--primary-brand); color: white;" onclick="alert('Provisioning new node...');"><i class="fas fa-plus"></i> Provision Node</button>
                </div>
            </header>

            <div id="clusters-container">
                <div style="color: var(--text-muted); font-size: 13px; font-style: italic;">Loading dynamic cluster telemetry...</div>
            </div>

        </main>
    </div>

    <script>
        const ADMIN_ID = localStorage.getItem('auth_user_id');
        const ADMIN_HEADERS = { 'X-User-Id': ADMIN_ID };

        async function loadProfile() {
            try {
                const response = await fetch('/api/user/profile', { headers: ADMIN_HEADERS });
                if (response.ok) {
                    const profile = await response.json();
                    if (profile && profile.full_name) {
                        document.getElementById('user-avatar').innerText = profile.full_name.charAt(0).toUpperCase();
                    }
                }
            } catch (err) {}
        }
        
        async function loadClusters() {
            try {
                const res = await fetch('/api/admin/clusters', { headers: ADMIN_HEADERS });
                if (!res.ok) throw new Error();
                const data = await res.json();
                const clusters = data.clusters || [];
                const container = document.getElementById('clusters-container');
                
                if (clusters.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted); font-size: 13px; font-style: italic;">No active clusters found.</div>';
                    return;
                }
                
                container.innerHTML = clusters.map(c => `
                    <div class="cluster-node-full">
                        <div class="node-header">
                            <div style="display: flex; align-items: center; gap: 16px;">
                                <div style="width: 48px; height: 48px; background: rgba(99,102,241,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--primary-brand);">
                                    <i class="fas fa-server"></i>
                                </div>
                                <div>
                                    <h3 style="font-size: 20px; font-weight: 800;">${c.name}</h3>
                                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${c.region} • ${c.cores} Cores / ${c.ram_total} RAM</div>
                                </div>
                            </div>
                            <div style="background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); font-size: 12px; padding: 6px 12px; border-radius: 6px; font-weight: 800;">${c.status}</div>
                        </div>
                        <div class="node-stats">
                            <div>
                                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">CPU Utilization (${c.cpu_utilization.toFixed(1)}%)</div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${c.cpu_utilization}%; background: ${c.cpu_utilization > 80 ? '#ef4444' : '#22c55e'};"></div></div>
                            </div>
                            <div>
                                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Memory Usage (${c.memory_used})</div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${c.memory_utilization}%; background: ${c.memory_utilization > 80 ? '#ef4444' : '#eab308'};"></div></div>
                            </div>
                            <div>
                                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Network I/O (${c.network_io})</div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${c.network_percent}%; background: var(--primary-brand);"></div></div>
                            </div>
                        </div>
                        <div style="margin-top: 24px; display: flex; gap: 12px;">
                            <button class="btn btn-secondary" style="font-size: 12px; padding: 8px 16px;">Restart Service</button>
                            <button class="btn btn-secondary" style="font-size: 12px; padding: 8px 16px; border-color: rgba(0,0,0,0.1);">View Logs</button>
                        </div>
                    </div>
                `).join('');
                
            } catch (err) {
                document.getElementById('clusters-container').innerHTML = '<div style="color: #ef4444; font-size: 13px;">Failed to load cluster data.</div>';
            }
        }
        
        loadProfile();
        loadClusters();
        setInterval(loadClusters, 5000); // Poll every 5s for dynamic effect
    </script>
    <script>
        if (window.self !== window.top) {
            const rail = document.querySelector('.nav-rail');
            const sidebar = document.querySelector('.sidebar');
            const appShell = document.querySelector('.app-shell');
            if (rail) rail.style.display = 'none';
            if (sidebar) sidebar.style.display = 'none';
            if (appShell) appShell.style.gridTemplateColumns = '1fr';
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const elements = document.querySelectorAll(".admin-card, .repo-card, .stat-card, section, .cluster-node, .log-terminal, table, .complexity-map, .chat-interface");
            elements.forEach((el, index) => {
                el.style.opacity = "0";
                el.style.transform = "translateY(20px)";
                el.style.transition = "all 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
                setTimeout(() => {
                    el.style.opacity = "1";
                    el.style.transform = "translateY(0)";
                }, 50 + (index * 40)); // Staggered delay
            });
        });
    </script>
</body>

</html>
