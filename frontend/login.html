<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establish Neural Link | Codebase Knowledge AI</title>
    <link rel="stylesheet" href="style.css?v=light-theme-v2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--canvas);
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .auth-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 80%);
        }

        .auth-particle {
            position: absolute;
            background: var(--primary-brand);
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(2px);
            animation: float 20s infinite linear;
        }

        @keyframes float {
            from { transform: translateY(100vh) translateX(0); }
            to { transform: translateY(-10vh) translateX(20px); }
        }

        /* Premium Auth Card */
        .auth-card {
            width: 100%;
            max-width: 480px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 40px;
            padding: 60px;
            backdrop-filter: blur(40px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 40px;
            padding: 1px;
            background: linear-gradient(to bottom right, rgba(0, 0, 0,0.1), transparent, rgba(99,102,241,0.2));
            -webkit-mask: linear-gradient(#ffffff 0 0) content-box, linear-gradient(#ffffff 0 0);
            mask: linear-gradient(#ffffff 0 0) content-box, linear-gradient(#ffffff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-box {
            width: 64px;
            height: 64px;
            background: var(--primary-brand);
            border-radius: 18px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            color: #0f172a;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }

        .auth-header h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 16px;
            padding: 16px 20px 16px 52px;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            transition: all 0.3s;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--primary-brand);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
        }

        /* Buttons */
        .btn-auth {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            margin-top: 12px;
        }

        .btn-login {
            background: var(--primary-brand);
            color: #0f172a;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.3);
            background: #4f46e5;
        }

        .social-auth {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .social-btn {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 14px;
            padding: 12px;
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .social-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            opacity: 0.2;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-subtle);
        }

        .divider span {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Loading Effect */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 10;
        }

        .neural-pulse {
            width: 60px;
            height: 60px;
            border: 2px solid var(--primary-brand);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="auth-bg" id="bg"></div>

    <div class="auth-card">
        <div class="loading-overlay" id="loader">
            <div class="neural-pulse"></div>
            <p style="margin-top: 24px; font-weight: 800; letter-spacing: 0.1em; font-size: 12px; color: var(--primary-brand);">ESTABLISHING NEURAL LINK...</p>
        </div>

        <div class="auth-header">
            <div class="logo-box">CK</div>
            <h2>Neural Link Login</h2>
            <p>Access your codebase intelligence hub.</p>
        </div>



        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-fingerprint input-icon"></i>
                <input type="email" id="emailInput" class="auth-input" placeholder="Operator Identity (Email)" required>
            </div>
            <div class="input-group">
                <i class="fas fa-key input-icon"></i>
                <input type="password" class="auth-input" placeholder="Neural Key" required>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--primary-brand);"> Stay Synchronized
                </label>
                <a href="#" style="font-size: 13px; color: var(--primary-brand); text-decoration: none; font-weight: 600;">Lost Key?</a>
            </div>

            <button type="submit" class="btn-auth btn-login">Initialize Neural Link</button>
        </form>

        <p style="text-align: center; margin-top: 40px; font-size: 14px; color: var(--text-muted);">
            New operator? <a href="register.html" style="color: var(--primary-brand); text-decoration: none; font-weight: 700;">Provision Credentials</a>
        </p>
    </div>

    <script>
        // Background particles
        const bg = document.getElementById('bg');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'auth-particle';
            const size = Math.random() * 4 + 2 + 'px';
            p.style.width = size;
            p.style.height = size;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 10 + 10) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            bg.appendChild(p);
        }

        // Form handling
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim().toLowerCase();
            const password = document.querySelector('input[placeholder="Neural Key"]').value;
            
            document.getElementById('loader').style.display = 'flex';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const user = data.user;
                    
                    // Store real authentication tokens
                    localStorage.setItem('auth_user_id', user.id);
                    localStorage.setItem('auth_user_role', user.role);
                    
                    setTimeout(() => {
                        if (user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'user-dashboard.html';
                        }
                    }, 1000);
                } else {
                    const error = await response.json();
                    alert("Authentication Failed: " + error.detail);
                    document.getElementById('loader').style.display = 'none';
                }
            } catch (err) {
                alert("Network error. Cannot reach backend.");
                document.getElementById('loader').style.display = 'none';
            }
        });
    </script>
</body>
</html>
